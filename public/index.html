<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title id="page-title">Inicio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f172a;
      --surface: #1e293b;
      --border:  #334155;
      --muted:   #94a3b8;
      --text:    #f1f5f9;
      --indigo:  #6366f1;
    }

    html, body { height: 100%; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    /* ── Vistas ── */
    .view {
      display: none;
      height: 100dvh;
      width: 100%;
    }
    .view.active { display: flex; }

    /* ── Vista: Inicio (portada) ── */
    #view-inicio {
      position: relative;
      align-items: flex-end;
      justify-content: center;
      background: linear-gradient(160deg, #1e1b4b, #0f172a 60%);
      background-size: cover;
      background-position: center;
    }
    #view-inicio.has-portada { background-image: var(--portada-url); }
    .cover-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.15) 45%, rgba(0,0,0,0.35) 100%);
      pointer-events: none;
    }
    .cover-content {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 560px;
      text-align: center;
      padding: 0 1.5rem 7.5rem;
    }
    .cover-logo {
      height: 4rem;
      object-fit: contain;
      margin: 0 auto 1rem;
      display: none;
    }
    .cover-logo.visible { display: block; }
    .cover-emoji {
      font-size: 3.2rem;
      margin-bottom: 0.6rem;
    }
    #cover-title {
      font-size: 1.7rem;
      font-weight: 800;
      text-shadow: 0 2px 12px rgba(0,0,0,0.5);
    }
    #cover-sub {
      color: #e2e8f0;
      font-size: 0.9rem;
      margin-top: 0.4rem;
      text-shadow: 0 1px 6px rgba(0,0,0,0.5);
    }

    /* ── Vista: Eventos ── */
    #view-eventos {
      align-items: center;
      justify-content: center;
      padding: 2rem 1.25rem 7.5rem;
    }
    .evt-card {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .evt-logo {
      height: 3rem;
      object-fit: contain;
      margin: 0 auto 0.8rem;
      display: none;
    }
    .evt-logo.visible { display: block; }
    .evt-emoji { font-size: 2.4rem; margin-bottom: 0.5rem; }
    .evt-card h2 { font-size: 1.3rem; font-weight: 700; margin-bottom: 0.4rem; }
    .evt-sub { color: var(--muted); font-size: 0.88rem; margin-bottom: 1.6rem; line-height: 1.5; }

    .evt-qr-wrap {
      background: #fff;
      border-radius: 16px;
      padding: 1rem;
      display: inline-block;
      box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    }
    .evt-qr-wrap img { display: block; width: 220px; height: 220px; }

    .evt-loading, .evt-error {
      color: var(--muted);
      font-size: 0.85rem;
      padding: 2rem 0;
    }

    /* ── Nav flotante ── */
    .nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: center; gap: 0.6rem;
      padding: 1rem;
      background: linear-gradient(to top, rgba(15,23,42,0.95), rgba(15,23,42,0));
      z-index: 10;
    }
    .nav-btn {
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(30,41,59,0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      border-radius: 999px;
      padding: 0.65rem 1.3rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .nav-btn.active {
      background: var(--indigo);
      border-color: var(--indigo);
    }
    .nav-btn:not(.active):hover { background: rgba(51,65,85,0.9); }

    /* ── Botón de login ── */
    .login-btn {
      position: fixed; top: 0.9rem; right: 0.9rem;
      z-index: 20;
      width: 2.4rem; height: 2.4rem;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(30,41,59,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s;
    }
    .login-btn:hover { background: rgba(51,65,85,0.9); }

    /* ── Modal login ── */
    .modal-wrap {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.6); z-index: 30;
      align-items: center; justify-content: center; padding: 1rem;
    }
    .modal-wrap.open { display: flex; }
    .modal-box {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.6rem;
      width: 100%; max-width: 340px;
    }
    .modal-box h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.2rem; }
    .modal-sub { font-size: 0.8rem; color: var(--muted); margin-bottom: 1.2rem; }
    .field { margin-bottom: 1rem; }
    .field label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 0.3rem; }
    .field input {
      width: 100%; border: 1.5px solid var(--border);
      background: var(--bg); color: var(--text);
      border-radius: 8px; padding: 0.55rem 0.75rem;
      font-size: 0.9rem;
    }
    .field input:focus { outline: none; border-color: var(--indigo); }
    .login-error {
      color: #fca5a5; font-size: 0.8rem;
      background: rgba(239,68,68,0.12);
      border-radius: 8px; padding: 0.5rem 0.7rem;
      margin-bottom: 0.9rem;
    }
    .modal-footer { display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 0.4rem; }
    .btn {
      border: none; border-radius: 8px;
      padding: 0.55rem 1.05rem;
      font-size: 0.85rem; font-weight: 600;
      cursor: pointer;
    }
    .btn-primary { background: var(--indigo); color: #fff; }
    .btn-primary:hover { background: #4f46e5; }
    .btn-ghost { background: var(--border); color: var(--text); }
    .btn-ghost:hover { background: #475569; }
  </style>
</head>
<body>

  <section id="view-inicio" class="view active">
    <div class="cover-overlay"></div>
    <div class="cover-content">
      <img id="cover-logo" class="cover-logo" src="" alt="" />
      <div class="cover-emoji" id="cover-emoji">🎧</div>
      <h1 id="cover-title">Bienvenidos</h1>
      <p id="cover-sub">Escaneá el QR en Eventos para subir tus fotos</p>
    </div>
  </section>

  <section id="view-eventos" class="view">
    <div class="evt-card">
      <img id="evt-logo" class="evt-logo" src="" alt="" />
      <div class="evt-emoji" id="evt-emoji">🎉</div>
      <h2 id="evt-title">Fotos del evento</h2>
      <p class="evt-sub">Escaneá el código QR con tu celular para subir tus fotos</p>
      <div id="evt-body">
        <p class="evt-loading">Cargando QR…</p>
      </div>
    </div>
  </section>

  <nav class="nav">
    <button class="nav-btn active" data-view="inicio">🏠 Inicio</button>
    <button class="nav-btn" data-view="eventos">🎉 Eventos</button>
  </nav>

  <button class="login-btn" id="btn-login" title="Panel de administración">🔑</button>

  <div class="modal-wrap" id="modal-login">
    <div class="modal-box">
      <h3>🔑 Iniciar sesión</h3>
      <p class="modal-sub">Acceso al panel de administración</p>
      <form id="login-form">
        <div class="field">
          <label>Usuario</label>
          <input type="text" id="login-usuario" autocomplete="username" required />
        </div>
        <div class="field">
          <label>Contraseña</label>
          <input type="password" id="login-clave" autocomplete="current-password" required />
        </div>
        <p class="login-error" id="login-error" style="display:none"></p>
        <div class="modal-footer">
          <button type="button" class="btn btn-ghost" id="btn-login-cancel">Cancelar</button>
          <button type="submit" class="btn btn-primary" id="btn-login-submit">Ingresar</button>
        </div>
      </form>
    </div>
  </div>

<script>
  // ── Navegación entre vistas ──────────────────────────────────────────────────
  let qrCargado = false;

  document.querySelectorAll('.nav-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('view-' + btn.dataset.view).classList.add('active');
      if (btn.dataset.view === 'eventos' && !qrCargado) cargarQR();
    });
  });

  // ── Personalización (título, logo, portada) ───────────────────────────────────
  fetch('/api/config').then(r => r.json()).then(cfg => {
    const titulo = cfg.titulo || 'Bienvenidos';
    document.title = titulo;
    document.getElementById('cover-title').textContent = titulo;
    document.getElementById('evt-title').textContent = titulo;

    if (cfg.logo) {
      document.getElementById('cover-logo').src = cfg.logo;
      document.getElementById('cover-logo').classList.add('visible');
      document.getElementById('cover-emoji').style.display = 'none';
      document.getElementById('evt-logo').src = cfg.logo;
      document.getElementById('evt-logo').classList.add('visible');
      document.getElementById('evt-emoji').style.display = 'none';
    }

    if (cfg.portada_img) {
      const el = document.getElementById('view-inicio');
      el.style.setProperty('--portada-url', `url(${cfg.portada_img})`);
      el.classList.add('has-portada');
    }
  }).catch(() => { /* si falla, se usa el estilo por defecto */ });

  // ── QR del evento (sesión fija) ─────────────────────────────────────────────
  async function cargarQR() {
    qrCargado = true;
    try {
      const data = await fetch('/api/sesion').then(r => r.json());
      document.getElementById('evt-body').innerHTML = `
        <div class="evt-qr-wrap"><img src="${data.qr}" alt="QR" /></div>
      `;
    } catch {
      document.getElementById('evt-body').innerHTML =
        '<p class="evt-error">No se pudo cargar el QR. Probá de nuevo en un momento.</p>';
      qrCargado = false;
    }
  }

  // ── Login / acceso al panel admin ───────────────────────────────────────────
  const modalLogin = document.getElementById('modal-login');

  document.getElementById('btn-login').addEventListener('click', async () => {
    try {
      const r = await fetch('/api/whoami');
      if (r.ok) { window.location.href = '/admin.html'; return; }
    } catch { /* si falla la comprobación, mostramos igual el login */ }
    document.getElementById('login-error').style.display = 'none';
    document.getElementById('login-form').reset();
    modalLogin.classList.add('open');
    document.getElementById('login-usuario').focus();
  });

  document.getElementById('btn-login-cancel').addEventListener('click', () =>
    modalLogin.classList.remove('open'));
  modalLogin.addEventListener('click', e => {
    if (e.target === e.currentTarget) modalLogin.classList.remove('open');
  });

  document.getElementById('login-form').addEventListener('submit', async e => {
    e.preventDefault();
    const usuario = document.getElementById('login-usuario').value.trim();
    const clave   = document.getElementById('login-clave').value;
    const errEl   = document.getElementById('login-error');
    errEl.style.display = 'none';
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ usuario, clave }),
      });
      if (r.ok) { window.location.href = '/admin.html'; return; }
      const data = await r.json().catch(() => ({}));
      errEl.textContent = data.error || 'Usuario o contraseña incorrectos';
      errEl.style.display = 'block';
    } catch {
      errEl.textContent = 'No se pudo conectar con el servidor';
      errEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
